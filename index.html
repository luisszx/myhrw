<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>myHRW</title>
<meta name="description" content="Rotina, faculdade e inglês: app pessoal offline.">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="myHRW">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --sunk:#E9E6DE; --ink:#1A1C19; --muted:#565B53;
  --line:#DCD8CE; --field:#80867D;
  --accent:#1E6B4E; --accent-ink:#FFFFFF; --accent-soft:#D6E9DF;
  --hero:#1E6B4E; --hero-ink:#FFFFFF; --hero-line:rgb(255 255 255 / .22);
  --danger:#A8291F; --toast-link:#A6E3C3;
  --serif:"Iowan Old Style","Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111311; --surface:#1A1D1A; --sunk:#262A25; --ink:#E9EBE5; --muted:#A3A99F;
    --line:#2E332D; --field:#6E756B;
    --accent:#6FCF9F; --accent-ink:#0B1F15; --accent-soft:#1D3529;
    --hero:#1C4A36; --hero-ink:#EEF6F1; --hero-line:rgb(255 255 255 / .16);
    --danger:#FF8F80; --toast-link:#1E6B4E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111311; --surface:#1A1D1A; --sunk:#262A25; --ink:#E9EBE5; --muted:#A3A99F;
  --line:#2E332D; --field:#6E756B;
  --accent:#6FCF9F; --accent-ink:#0B1F15; --accent-soft:#1D3529;
  --hero:#1C4A36; --hero-ink:#EEF6F1; --hero-line:rgb(255 255 255 / .16);
  --danger:#FF8F80; --toast-link:#1E6B4E;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.005em}
h1{font-size:2.1rem}
h2{font-size:1.35rem}
h3{font-size:1.12rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:30}
.skip:focus{top:12px}

/* layout */
.app{max-width:680px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
.page-head{margin:4px 0 20px}
.page-head .lede{color:var(--muted);margin-top:4px}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sec-head .push{margin-left:auto}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 20px;min-height:44px;font-weight:650;text-decoration:none}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--ink);border:1px solid var(--field);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:550}
.btn-ghost:hover:not(:disabled){background:var(--sunk)}
.btn-text{background:none;border:0;color:var(--accent);font-weight:650;padding:8px 4px;min-height:44px}
.btn-text:hover{text-decoration:underline}
.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:#fff}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;border-radius:50%;color:var(--muted)}
.icon-btn:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
kbd{font:600 .72rem/1 var(--sans);border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.75}
@media (hover:none){kbd{display:none}}

input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--field);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.field{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.field .opt{font-weight:400;color:var(--muted)}
.grid2{display:grid;gap:12px}
@media (min-width:520px){.grid2{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:12px}
.row-end{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.row-end .field{flex:1;min-width:160px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.file-btn{position:relative;cursor:pointer}
.file-btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}

.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--field);border-radius:50%;display:grid;place-items:center;background:var(--surface);cursor:pointer;flex:none}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.hit{display:grid;place-items:center;padding:10px;cursor:pointer;flex:none}

.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-weight:600;font-size:.92rem;padding:0;margin-bottom:6px}
.seg-opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--field);border-radius:10px;overflow:hidden}
.seg-opts label{position:relative}
.seg-opts label+label{border-left:1px solid var(--field)}
.seg-opts input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opts span{display:block;text-align:center;padding:10px 6px;min-height:44px;font-size:.92rem}
.seg-opts input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:650}
.seg-opts input:focus-visible+span{outline:3px solid var(--accent);outline-offset:-5px;border-radius:8px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--field);background:transparent;border-radius:999px;padding:6px 14px;min-height:40px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs ul{list-style:none;margin:0 auto;padding:0;max-width:680px;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);color:var(--muted);text-decoration:none;font-size:.76rem;font-weight:550}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs svg{width:24px;height:24px}
.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;line-height:18px;text-align:center}

/* HOJE */
.today-head .dateline{color:var(--muted);font-size:.95rem;text-transform:lowercase}
.today-head .dateline::first-letter{text-transform:uppercase}
.today-head h1{font-size:clamp(2rem,8vw,2.6rem);margin-top:2px}
.hoje-grid{display:grid;gap:8px}
.now{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px 20px 4px;margin:20px 0 24px}
.now :focus-visible{outline-color:var(--hero-ink)}
.now-title:focus{outline:none}
.now-when{display:flex;align-items:center;gap:8px;font-size:.95rem}
.now-when .pulse{width:9px;height:9px;border-radius:50%;background:var(--hero-ink);flex:none}
.now-focus{display:flex;align-items:flex-start;gap:4px;margin:10px 0 2px 0}
.now-focus .hit{padding:8px 8px 8px 0}
.now .check{width:30px;height:30px;border-color:var(--hero-ink);background:transparent}
.now .check:checked{background:var(--hero-ink)}
.now .check:checked::after{border-color:var(--hero);width:8px;height:14px}
.now-title{font-size:clamp(1.65rem,6.5vw,2.25rem);line-height:1.12;overflow-wrap:anywhere;margin:12px 0 4px}
.now-focus .now-title{margin:6px 0 4px}
.now-sub{font-size:.92rem}
.now-list{list-style:none;margin:16px -20px 0;padding:0;border-top:1px solid var(--hero-line)}
.now-list li+li{border-top:1px solid var(--hero-line)}
.now-link{display:flex;align-items:baseline;gap:14px;width:100%;padding:12px 20px;background:none;border:0;color:inherit;text-decoration:none;text-align:left;font-size:.95rem}
.now-link:hover{background:var(--hero-line)}
.now-link .big{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1;min-width:2.3ch;font-variant-numeric:tabular-nums}
.now-list li:last-child .now-link{border-radius:0 0 20px 20px}

.quick{display:flex;gap:8px;margin:6px 0 22px}
.quick input{flex:1}
.period{position:relative;padding:0 0 22px 30px}
.period::before{content:"";position:absolute;left:8px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.period:last-of-type::before{display:none}
.period-dot{position:absolute;left:0;top:6px;width:18px;height:18px;border-radius:50%;border:2px solid var(--field);background:var(--bg)}
.period.is-now .period-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.period.is-past .period-dot{background:var(--sunk);border-color:var(--sunk)}
.period-head{display:flex;align-items:center;gap:10px;min-height:44px}
.period-head h3{font-size:1.25rem}
.period.is-past h3{color:var(--muted)}
.period-role{color:var(--muted);font-size:.88rem}
.period-head .icon-btn{margin-left:auto}
.now-pill{font-size:.75rem;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:0 8px;line-height:1.6}
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;border-top:1px solid var(--line)}
.task:last-child{border-bottom:1px solid var(--line)}
.task .hit{padding:10px 10px 10px 0}
.task-body{flex:1;min-width:0;padding:10px 0;display:grid;gap:1px}
.task-title{overflow-wrap:anywhere}
.task.is-high .task-title{font-weight:650}
.task.is-done .task-title{text-decoration:line-through;color:var(--muted);font-weight:400}
.task-meta{font-size:.82rem;color:var(--muted)}
.task-meta .prio{color:var(--accent);font-weight:650}
.late{color:var(--danger);font-weight:650}
.empty{color:var(--muted);font-size:.92rem;padding:4px 0}
.nudge{margin-top:8px;font-size:.9rem;color:var(--muted)}

/* ESTUDOS */
.exams{list-style:none;margin:6px 0 0;padding:0}
.exam{display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.exam:last-child{border-bottom:1px solid var(--line)}
.exam-count{text-align:center;line-height:1}
.exam-count .n{display:block;font-family:var(--serif);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.exam-count .n.word{font-size:1.25rem}
.exam-count .u{display:block;font-size:.75rem;color:var(--muted);margin-top:3px}
.exam.is-soon .n{color:var(--accent)}
.exam.is-late .n{color:var(--danger)}
.exam-title{font-weight:650;overflow-wrap:anywhere}
.exam-meta{font-size:.85rem;color:var(--muted)}
.exam.is-done .exam-title{text-decoration:line-through;color:var(--muted);font-weight:400}
.exam-actions{display:flex;align-items:center}
.type{display:inline-block;font-size:.75rem;font-weight:650;border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-right:6px;line-height:1.55}
.type.prova{color:var(--accent)}

.goals{list-style:none;margin:6px 0 0;padding:0}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.goal:last-child{border-bottom:1px solid var(--line)}
.goal-title{overflow-wrap:anywhere;margin-bottom:6px}
.goal.is-done .goal-title::after{content:" ✓";color:var(--accent);font-weight:700}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s ease}
.stepper{display:flex;align-items:center}
.stepper output{min-width:4.2ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}
.stepper .icon-btn{font-size:1.4rem;line-height:1;color:var(--ink)}
.week-sum{margin-top:10px;color:var(--muted);font-size:.9rem}

/* INGLÊS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin:4px 0 8px}
.stats>div{padding:12px 0 12px 14px}
.stats>div:first-child{padding-left:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats .big{display:block;font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stats .lbl{font-size:.82rem;color:var(--muted)}
.stats .on .big{color:var(--accent)}

.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sess-left{font-size:.95rem}
.sess-left strong{font-family:var(--serif);font-size:1.3rem}
.sess-top .btn-text{margin-left:auto}
.sess-bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:14px}
.sess-bar span{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 20px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer}
.flash-cat{font-size:.82rem;color:var(--muted)}
.flash-front{font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.5rem);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.flash-rule{width:48px;height:2px;background:var(--accent);border:0;margin:6px 0}
.flash-back{font-size:1.25rem;font-weight:600}
.flash-ex{color:var(--muted);font-style:italic;max-width:36ch}
.reveal{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sess-actions{display:flex;gap:10px;margin-top:14px}
.sess-actions>*{flex:1;min-height:54px;font-size:1.02rem}
.sess-done{padding:28px 20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:center;display:grid;gap:10px;justify-items:center}
.sess-done h2{font-size:1.7rem}
.start-box p{margin:6px 0 14px;color:var(--muted)}

.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.box{display:grid;gap:3px;text-align:center}
.box-track{height:72px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.box-track span{display:block;width:100%;background:var(--accent);min-height:2px;transition:height .25s ease}
.box-n{font-family:var(--serif);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.box-l{font-size:.75rem;color:var(--muted);line-height:1.25}

.more{border-top:1px solid var(--line)}
.more:last-of-type{border-bottom:1px solid var(--line)}
.more+.more{margin-top:0}
.more summary{display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;list-style:none;font-family:var(--serif);font-weight:600;font-size:1.15rem}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .2s ease;flex:none;margin:0 4px}
.more[open] summary::before{transform:rotate(45deg)}
.more>.inner{padding:2px 0 18px}
.hint{font-size:.9rem;color:var(--muted);margin-bottom:12px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.card-list{list-style:none;margin:10px 0 0;padding:0;max-height:60vh;overflow:auto}
.card-list li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:4px 0}
.card-list .cl-text{flex:1;min-width:0;display:grid}
.cl-front{font-weight:600;overflow-wrap:anywhere}
.cl-back{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.cl-box{font-size:.8rem;color:var(--muted);white-space:nowrap}

/* AJUSTES */
.set-p{color:var(--muted);margin:4px 0 0}
.foot{margin-top:40px;font-size:.85rem;color:var(--muted)}

/* dialogs */
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(10 12 10 / .5)}
dialog form{display:grid;gap:16px;padding:22px 20px 20px}
dialog h2{font-size:1.45rem}
.dlg-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.dlg-actions .spacer{flex:1}
@media (max-width:560px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .25);font-size:.95rem;min-height:44px}
.toast:empty{display:none}
.toast button{background:none;border:0;color:var(--toast-link);font-weight:700;padding:8px 10px;min-height:40px}
.toast button:focus-visible{outline-color:var(--toast-link)}

/* desktop */
@media (min-width:960px){
  .app.wide{max-width:1060px}
  .hoje-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
  .hoje-grid .now{position:sticky;top:24px;margin:8px 0 0}
  .hoje-grid .day{padding-top:4px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#app">Pular para o conteúdo</a>

<main id="app" class="app" tabindex="-1"></main>

<nav class="tabs" aria-label="Seções">
  <ul>
    <li><a href="#hoje" data-tab="hoje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      Hoje</a></li>
    <li><a href="#estudos" data-tab="estudos">

<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const KEY = 'myhrw:v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5); // b - a
const weekStart = (s = today()) => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

const fmtLong = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDay = new Intl.DateTimeFormat('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtMon = new Intl.DateTimeFormat('pt-BR', { month: 'short' });
const dayLabel = s => fmtDay.format(parse(s)).replace(/\./g, '');
const rel = n => n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n === -1 ? 'ontem' : n > 0 ? `em ${n} dias` : `há ${-n} dias`;

/* ---------- domínio ---------- */
const PERIODS = [
  { id: 'manha', label: 'Manhã', role: 'Trabalho', hours: '6h–12h', prep: 'à manhã' },
  { id: 'tarde', label: 'Tarde', role: 'Livre', hours: '12h–18h', prep: 'à tarde' },
  { id: 'noite', label: 'Noite', role: 'Faculdade', hours: '18h–23h', prep: 'à noite' }
];
const CATS = { dia: 'Dia a dia', ti: 'TI/Trabalho', irlanda: 'Irlanda/Viagem' };
const INTERVALS = [0, 1, 2, 4, 8, 16]; // dias por caixa (1–5)
const MAX_GOALS = 5;

const currentPeriodId = (d = new Date()) => {
  const h = d.getHours();
  return h >= 5 && h < 12 ? 'manha' : h >= 12 && h < 18 ? 'tarde' : 'noite';
};

const SEED = [
  // TI / Trabalho
  ['to deploy', 'implantar, publicar (uma versão)', "We'll deploy the fix to production tonight.", 'ti'],
  ['bug report', 'relatório de erro', 'Could you file a bug report with the steps to reproduce?', 'ti'],
  ['to troubleshoot', 'investigar e resolver um problema', 'I spent the whole morning troubleshooting the VPN.', 'ti'],
  ['downtime', 'tempo fora do ar', 'The server had two hours of downtime last week.', 'ti'],
  ['ticket', 'chamado', "I've opened a ticket with the network team.", 'ti'],
  ['to roll back', 'reverter (uma atualização)', 'The update broke the login page, so we rolled it back.', 'ti'],
  ['on call', 'de plantão, de sobreaviso', "I'm on call this weekend, so keep your phone close.", 'ti'],
  ['backlog', 'lista de pendências', "Let's add that feature to the backlog.", 'ti'],
  ['stand-up', 'reunião diária rápida', "I'll bring it up at tomorrow's stand-up.", 'ti'],
  ['to reach out', 'entrar em contato', 'Feel free to reach out if you have any questions.', 'ti'],
  // Dia a dia
  ["How's it going?", 'Como vai? / E aí, tudo certo?', "Hey, how's it going? — Not bad, you?", 'dia'],
  ["I'm running late", 'Estou atrasado', "Sorry, I'm running late. I'll be there in ten minutes.", 'dia'],
  ['to catch up', 'colocar o papo em dia', "Let's grab a coffee and catch up.", 'dia'],
  ['Never mind', 'Deixa pra lá', 'Never mind, I found it.', 'dia'],
  ['to figure out', 'descobrir, entender', "I can't figure out how this works.", 'dia'],
  ["I'm up for it", 'Topo! / Estou dentro', "Pizza tonight? — Sure, I'm up for it.", 'dia'],
  ['to hang out', 'sair, passar tempo junto', 'We used to hang out after class.', 'dia'],
  ['Could you say that again?', 'Pode repetir?', 'Sorry, could you say that again a bit slower?', 'dia'],
  ['That makes sense', 'Faz sentido', 'Oh, that makes sense now. Thanks!', 'dia'],
  ['to look forward to', 'estar ansioso por (algo bom)', "I'm really looking forward to the weekend.", 'dia'],
  // Irlanda / Viagem
  ['landlord', 'proprietário (de quem você aluga)', 'The landlord asked for one month’s rent as a deposit.', 'irlanda'],
  ['deposit', 'caução, depósito', "You'll get your deposit back when you move out.", 'irlanda'],
  ['bills included', 'contas incluídas', 'Is the rent €900 with bills included?', 'irlanda'],
  ['viewing', 'visita ao imóvel', 'Can I book a viewing for Saturday morning?', 'irlanda'],
  ['Leap Card', 'cartão de transporte (Dublin)', 'You can top up your Leap Card at any Luas stop.', 'irlanda'],
  ['return ticket', 'passagem de ida e volta', 'A return ticket to Galway, please.', 'irlanda'],
  ['PPS number', 'número de identificação fiscal irlandês (PPSN)', 'You need a PPS number before you start working.', 'irlanda'],
  ['payslip', 'holerite, contracheque', 'Check how much tax you paid on your payslip.', 'irlanda'],
  ['notice period', 'aviso prévio', 'My contract has a one-month notice period.', 'irlanda'],
  ['grand', 'tranquilo, ótimo (gíria irlandesa)', "How are you? — Ah, grand, thanks.", 'irlanda']
];

function seedCards() {
  const t = today();
  return SEED.map(([front, back, example, category]) => ({ id: uid(), front, back, example, category, box: 1, due: t, created: t, reviews: 0, lapses: 0 }));
}
function defaultState() {
  return {
    version: 1,
    settings: { name: '', theme: 'auto', sessionLimit: 0, lastBackup: null },
    tasks: [], exams: [], goals: [], cards: seedCards(), studyDays: []
  };
}
const arr = (v, fb) => Array.isArray(v) ? v : fb;
function migrate(d) {
  const base = defaultState();
  if (!d || typeof d !== 'object') return base;
  return {
    version: 1,
    settings: { ...base.settings, ...(d.settings || {}) },
    tasks: arr(d.tasks, []).filter(x => x && x.title).map(x => ({ id: x.id || uid(), title: String(x.title), period: PERIODS.some(p => p.id === x.period) ? x.period : 'tarde', due: isDate(x.due) ? x.due : null, priority: [1, 2, 3].includes(+x.priority) ? +x.priority : 2, done: !!x.done, doneAt: isDate(x.doneAt) ? x.doneAt : null, created: x.created || new Date().toISOString() })),
    exams: arr(d.exams, []).filter(x => x && x.title && isDate(x.date)).map(x => ({ id: x.id || uid(), title: String(x.title), subject: String(x.subject || ''), type: x.type === 'entrega' ? 'entrega' : 'prova', date: x.date, done: !!x.done })),
    goals: arr(d.goals, []).filter(x => x && x.title && isDate(x.week)).map(x => ({ id: x.id || uid(), title: String(x.title), target: Math.max(1, +x.target || 1), progress: Math.max(0, +x.progress || 0), week: x.week })),
    cards: arr(d.cards, base.cards).filter(x => x && x.front && x.back).map(x => ({ id: x.id || uid(), front: String(x.front), back: String(x.back), example: String(x.example || ''), category: CATS[x.category] ? x.category : 'dia', box: Math.min(5, Math.max(1, +x.box || 1)), due: isDate(x.due) ? x.due : today(), created: x.created || today(), reviews: +x.reviews || 0, lapses: +x.lapses || 0 })),
    studyDays: arr(d.studyDays, []).filter(isDate)
  };
}

let S;
function load() {
  try { const raw = localStorage.getItem(KEY); S = raw ? migrate(JSON.parse(raw)) : defaultState(); }
  catch { S = defaultState(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { toast('Não foi possível salvar neste navegador.'); }
}

const findIn = (coll, id) => S[coll].find(x => x.id === id);

function sortTasks(list) {
  const t = today();
  return [...list].sort((a, b) =>
    (b.due && b.due < t) - (a.due && a.due < t) ||
    b.priority - a.priority ||
    (a.due || '9999').localeCompare(b.due || '9999') ||
    String(a.created).localeCompare(String(b.created)));
}
const upcomingExams = () => { const t = today(); return S.exams.filter(e => !e.done && e.date >= t).sort((a, b) => a.date.localeCompare(b.date)); };
const weekGoals = (w = weekStart()) => S.goals.filter(g => g.week === w);
const dueCards = (cat = 'all') => { const t = today(); return S.cards.filter(c => c.due <= t && (cat === 'all' || c.category === cat)); };
function streak() {
  const set = new Set(S.studyDays);
  let d = today(), n = 0;
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function markStudied() {
  const t = today();
  if (!S.studyDays.includes(t)) { S.studyDays.push(t); S.studyDays = S.studyDays.slice(-500); }
}

/* ---------- estado de interface (não persistido) ---------- */
const ui = { focus: null, returnFk: null, open: {}, cat: 'all', lastCat: 'dia', search: '', confirmFn: null, sig: '' };
let session = null; // { queue, i, flipped, right, wrong, finished }

/* ---------- ícones ---------- */
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>'
};

/* ---------- views ---------- */
function taskMeta(x, plain) {
  const t = today(), parts = [];
  if (x.priority === 3) parts.push(plain ? 'Alta prioridade' : '<span class="prio">Alta prioridade</span>');
  if (x.priority === 1) parts.push('Baixa prioridade');
  if (x.due) {
    const n = diffDays(t, x.due);
    if (n < 0 && !x.done) parts.push(plain ? `Atrasada ${plural(-n, 'dia', 'dias')}` : `<span class="late">Atrasada ${plural(-n, 'dia', 'dias')}</span>`);
    else if (n <= 1 && n >= 0) parts.push(`Prazo ${rel(n)}`);
    else parts.push(`Prazo ${dayLabel(x.due)}`);
  }
  return parts.join(' · ');
}

function taskRow(x) {
  const meta = taskMeta(x);
  return `<li class="task${x.done ? ' is-done' : ''}${x.priority === 3 ? ' is-high' : ''}">
    <label class="hit"><input type="checkbox" class="check" data-change="toggle-task" data-id="${x.id}" data-fk="chk-${x.id}" ${x.done ? 'checked' : ''} aria-label="${esc(x.title)}"></label>
    <div class="task-body"><span class="task-title">${esc(x.title)}</span>${meta ? `<span class="task-meta">${meta}</span>` : ''}</div>
    <button type="button" class="icon-btn" data-action="edit-task" data-id="${x.id}" data-fk="edit-${x.id}" aria-label="Editar: ${esc(x.title)}">${ICON.edit}</button>
  </li>`;
}

function viewHoje() {
  const t = today(), now = new Date(), cur = currentPeriodId(now);
  const curIdx = PERIODS.findIndex(p => p.id === cur), per = PERIODS[curIdx];
  const h = now.getHours();
  const greet = h >= 5 && h < 12 ? 'Bom dia' : h >= 12 && h < 18 ? 'Boa tarde' : 'Boa noite';
  const name = S.settings.name.trim();
  const open = S.tasks.filter(x => !x.done);
  const nowTasks = sortTasks(open.filter(x => x.period === cur));
  const focus = nowTasks[0];
  const late = open.filter(x => x.due && x.due < t).length;
  const exam = upcomingExams()[0];
  const due = dueCards().length;
  const st = streak();
  const goals = weekGoals();
  const gDone = goals.filter(g => g.progress >= g.target).length;

  const EMPTY = {
    manha: 'Nada pendente no trabalho por agora.',
    tarde: 'Tarde livre. Bom momento para revisar inglês.',
    noite: 'Nada pendente para a faculdade hoje.'
  };

  let hero;
  if (focus) {
    const meta = [taskMeta(focus, true), nowTasks.length > 1 ? `mais ${nowTasks.length - 1} neste período` : ''].filter(Boolean).join(' · ');
    hero = `<div class="now-focus">
      <label class="hit"><input type="checkbox" class="check" data-change="toggle-task" data-id="${focus.id}" data-fk="now-check" aria-label="Concluir: ${esc(focus.title)}"></label>
      <div><h2 id="now-title" class="now-title" tabindex="-1">${esc(focus.title)}</h2>${meta ? `<p class="now-sub">${esc(meta)}</p>` : ''}</div>
    </div>`;
  } else {
    hero = `<h2 id="now-title" class="now-title" tabindex="-1">${EMPTY[cur]}</h2>`;
  }

  const items = [];
  if (late) items.push(`<li><button type="button" class="now-link" data-action="goto-day" data-fk="goto-day"><span class="big">${late}</span><span>${late === 1 ? 'tarefa atrasada' : 'tarefas atrasadas'}</span></button></li>`);
  if (exam) {
    const n = diffDays(t, exam.date);
    const what = `<strong>${esc(exam.title)}</strong>${exam.subject ? ` · ${esc(exam.subject)}` : ''}`;
    items.push(`<li><a class="now-link" href="#estudos"><span class="big">${n === 0 ? 'Hoje' : n}</span><span>${n === 0 ? '' : n === 1 ? 'dia até ' : 'dias até '}${what}</span></a></li>`);
  }
  items.push(`<li><a class="now-link" href="#ingles"><span class="big">${due}</span><span>${due === 1 ? 'cartão' : 'cartões'} de inglês para hoje${st ? ` · sequência de ${plural(st, 'dia', 'dias')}` : ''}</span></a></li>`);
  if (goals.length) items.push(`<li><a class="now-link" href="#estudos"><span class="big">${gDone}/${goals.length}</span><span>metas da semana cumpridas</span></a></li>`);

  const periods = PERIODS.map((p, i) => {
    const list = sortTasks(open.filter(x => x.period === p.id));
    const doneToday = S.tasks.filter(x => x.done && x.period === p.id && x.doneAt === t);
    return `<div class="period${i === curIdx ? ' is-now' : ''}${i < curIdx ? ' is-past' : ''}">
      <span class="period-dot" aria-hidden="true"></span>
      <div class="period-head">
        <h3>${p.label}</h3><span class="period-role">${p.role} · ${p.hours}</span>${i === curIdx ? '<span class="now-pill">agora</span>' : ''}
        <button type="button" class="icon-btn" data-action="new-task" data-period="${p.id}" data-fk="add-${p.id}" aria-label="Adicionar tarefa ${p.prep}">${ICON.plus}</button>
      </div>
      ${list.length || doneToday.length ? `<ul class="tasks">${list.map(taskRow).join('')}${doneToday.map(taskRow).join('')}</ul>` : '<p class="empty">Sem tarefas.</p>'}
    </div>`;
  }).join('');

  const older = S.tasks.filter(x => x.done && x.doneAt !== t);
  const olderHtml = older.length ? `
    <details class="more" data-key="older" ${ui.open.older ? 'open' : ''}>
      <summary>Concluídas antes <span class="muted num">(${older.length})</span></summary>
      <div class="inner">
        <ul class="tasks">${older.sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))).slice(0, 50).map(taskRow).join('')}</ul>
        <div class="row-btns"><button type="button" class="btn-ghost" data-action="clear-done" data-fk="clear-done">Limpar concluídas</button></div>
      </div>
    </details>` : '';

  const hasData = S.tasks.length || S.exams.length || S.studyDays.length;
  const lb = S.settings.lastBackup;
  const lbDays = lb ? diffDays(lb, t) : null;
  const nudge = hasData && (lbDays === null || lbDays > 14)
    ? `<p class="nudge">${lb ? `Último backup ${rel(-lbDays)}.` : 'Você ainda não fez backup.'} <a href="#ajustes">Exportar dados</a></p>` : '';

  return `
  <header class="today-head">
    <p class="dateline">${esc(fmtLong.format(now))}</p>
    <h1>${greet}${name ? `, ${esc(name)}` : ''}.</h1>
  </header>
  <div class="hoje-grid">
    <section class="now" aria-labelledby="now-title">
      <p class="now-when"><span class="pulse" aria-hidden="true"></span><span>Agora · <strong>${per.label}</strong>, ${per.role.toLowerCase()}</span></p>
      ${hero}
      <ul class="now-list">${items.join('')}</ul>
    </section>
    <section class="day" id="dia" aria-labelledby="day-h" tabindex="-1">
      <div class="sec-head"><h2 id="day-h">O dia</h2><button type="button" class="btn-text push" data-action="new-task" data-fk="new-task">+ Nova tarefa</button></div>
      <form class="quick" id="form-quick" autocomplete="off">
        <label for="quick-input" class="sr-only">Adicionar tarefa ${per.prep}</label>
        <input id="quick-input" type="text" name="q" maxlength="140" placeholder="Adicionar ${per.prep}…" data-fk="quick" enterkeyhint="done">
        <button class="btn" type="submit">Adicionar</button>
      </form>
      ${periods}
      ${olderHtml}
      ${nudge}
    </section>
  </div>`;
}

function examRow(e) {
  const t = today(), n = diffDays(t, e.date);
  let cls = '', count;
  if (e.done) count = `<span class="n word">✓</span><span class="u">feito</span>`;
  else if (n === 0) { cls = ' is-soon'; count = `<span class="n word">Hoje</span>`; }
  else if (n < 0) { cls = ' is-late'; count = `<span class="n">${-n}</span><span class="u">${-n === 1 ? 'dia atrás' : 'dias atrás'}</span>`; }
  else { cls = n <= 3 ? ' is-soon' : ''; count = `<span class="n">${n}</span><span class="u">${n === 1 ? 'dia' : 'dias'}</span>`; }
  return `<li class="exam${cls}${e.done ? ' is-done' : ''}">
    <div class="exam-count" aria-hidden="true">${count}</div>
    <div>
      <p class="exam-title">${esc(e.title)}</p>
      <p class="exam-meta"><span class="type ${e.type}">${e.type === 'prova' ? 'Prova' : 'Entrega'}</span>${e.subject ? esc(e.subject) + ' · ' : ''}${dayLabel(e.date)}<span class="sr-only">, ${e.done ? 'concluída' : rel(n)}</span></p>
    </div>
    <div class="exam-actions">
      <label class="hit"><input type="checkbox" class="check" data-change="toggle-exam" data-id="${e.id}" data-fk="exchk-${e.id}" ${e.done ? 'checked' : ''} aria-label="Concluída: ${esc(e.title)}"></label>
      <button type="button" class="icon-btn" data-action="edit-exam" data-id="${e.id}" data-fk="exedit-${e.id}" aria-label="Editar: ${esc(e.title)}">${ICON.edit}</button>
    </div>
  </li>`;
}

function viewEstudos() {
  const pending = S.exams.filter(e => !e.done).sort((a, b) => a.date.localeCompare(b.date));
  const done = S.exams.filter(e => e.done).sort((a, b) => b.date.localeCompare(a.date));
  const ws = weekStart(), we = addDays(ws, 6);
  const goals = weekGoals(ws);
  const prev = weekGoals(addDays(ws, -7));
  const d1 = parse(ws), d2 = parse(we);
  const mon = d => fmtMon.format(d).replace('.', '');
  const range = d1.getMonth() === d2.getMonth() ? `${d1.getDate()}–${d2.getDate()} ${mon(d2)}` : `${d1.getDate()} ${mon(d1)} – ${d2.getDate()} ${mon(d2)}`;
  const totalT = goals.reduce((s, g) => s + g.target, 0), totalP = goals.reduce((s, g) => s + Math.min(g.progress, g.target), 0);

  const goalRows = goals.map(g => {
    const pct = Math.min(100, Math.round(g.progress / g.target * 100));
    const ok = g.progress >= g.target;
    return `<li class="goal${ok ? ' is-done' : ''}">
      <div>
        <p class="goal-title">${esc(g.title)}</p>
        <div class="bar" role="progressbar" aria-label="Progresso: ${esc(g.title)}" aria-valuemin="0" aria-valuemax="${g.target}" aria-valuenow="${Math.min(g.progress, g.target)}"><span style="width:${pct}%"></span></div>
      </div>
      <div class="stepper">
        <button type="button" class="icon-btn" data-action="goal-dec" data-id="${g.id}" data-fk="dec-${g.id}" aria-label="Diminuir: ${esc(g.title)}" ${g.progress <= 0 ? 'disabled' : ''}>−</button>
        <output class="num">${g.progress}/${g.target}</output>
        <button type="button" class="icon-btn" data-action="goal-inc" data-id="${g.id}" data-fk="inc-${g.id}" aria-label="Aumentar: ${esc(g.title)}">+</button>
        <button type="button" class="icon-btn" data-action="edit-goal" data-id="${g.id}" data-fk="gedit-${g.id}" aria-label="Editar: ${esc(g.title)}">${ICON.edit}</button>
      </div>
    </li>`;
  }).join('');

  return `
  <header class="page-head"><h1>Estudos</h1><p class="lede">ADS à noite · entregas, provas e metas</p></header>

  <section aria-labelledby="ex-h">
    <div class="sec-head"><h2 id="ex-h">Entregas e provas</h2><button type="button" class="btn-text push" data-action="new-exam" data-fk="new-exam">+ Adicionar</button></div>
    ${pending.length ? `<ol class="exams">${pending.map(examRow).join('')}</ol>` : '<p class="empty">Nenhuma entrega ou prova marcada. Adicione a próxima assim que o professor anunciar.</p>'}
    ${done.length ? `<details class="more sec" data-key="examsDone" ${ui.open.examsDone ? 'open' : ''}><summary>Concluídas <span class="muted num">(${done.length})</span></summary><div class="inner"><ol class="exams">${done.map(examRow).join('')}</ol></div></details>` : ''}
  </section>

  <section class="sec" aria-labelledby="goals-h">
    <div class="sec-head"><h2 id="goals-h">Metas da semana</h2><span class="muted">${range}</span>
      <button type="button" class="btn-text push" data-action="new-goal" data-fk="new-goal" ${goals.length >= MAX_GOALS ? 'disabled' : ''}>+ Meta</button></div>
    ${goals.length ? `<ul class="goals">${goalRows}</ul>
      <p class="week-sum">${totalP} de ${totalT} passos nesta semana${goals.length >= MAX_GOALS ? ' · limite de 5 metas' : ''}.</p>`
      : `<p class="empty">Escolha até 5 metas para esta semana.</p>
         ${prev.length ? `<div class="row-btns"><button type="button" class="btn-ghost" data-action="repeat-goals">Repetir metas da semana passada (${prev.length})</button></div>` : ''}`}
  </section>`;
}

function viewIngles() {
  const t = today();
  const due = dueCards();
  const st = streak();
  const studiedToday = S.studyDays.includes(t);

  const stats = `<div class="stats">
    <div class="${studiedToday ? 'on' : ''}"><span class="big">${st}</span><span class="lbl">${st === 1 ? 'dia seguido' : 'dias seguidos'}${studiedToday ? ' · hoje ✓' : ''}</span></div>
    <div><span class="big">${due.length}</span><span class="lbl">para hoje</span></div>

  let review;
  if (session && session.finished) {
    review = `<div class="sess-done">

  } else if (session) {

    const pct = Math.round(session.i / session.queue.length * 100);
    review = `<div class="sess-top">
        <h2 id="rev-h" class="sr-only">Sessão de revisão</h2>

      </div>

      <article class="flash"${session.flipped ? '' : ' data-action="flip"'} aria-live="polite">
        <p class="flash-cat">${CATS[c.category]} · caixa ${c.box}</p>
        <p class="flash-front" lang="en">${esc(c.front)}</p>
        ${session.flipped ? `<div class="reveal" style="display:grid;justify-items:center;gap:8px">

          ${c.example ? `<p class="flash-ex" lang="en">“${esc(c.example)}”</p>` : ''}

      </article>
      <div class="sess-actions">
        ${session.flipped
          ? `<button type="button" class="btn-ghost" data-action="answer" data-ok="0" data-fk="ans0">Errei <kbd>1</kbd></button>

          : `<button type="button" class="btn" data-action="flip" data-fk="flip">Mostrar resposta <kbd>Espaço</kbd></button>`}
      </div>`;
  } else {
    const n = dueCards(ui.cat).length;
    const lim = +S.settings.sessionLimit;
    const future = S.cards.filter(c => c.due > t).map(c => c.due).sort()[0];
    const chip = (id, label) => `<button type="button" class="chip" data-action="set-cat" data-cat="${id}" data-fk="cat-${id}" aria-pressed="${ui.cat === id}">${label} <span class="num">${dueCards(id).length}</span></button>`;
    review = `<div class="start-box">
      <h2 id="rev-h">Revisão de hoje</h2>
      <div class="chips" role="group" aria-label="Categoria da sessão">${chip('all', 'Todas')}${Object.entries(CATS).map(([k, v]) => chip(k, v)).join('')}</div>
      <p>${n ? `${plural(n, 'cartão vencido', 'cartões vencidos')}${lim && n > lim ? `. A sessão terá ${lim}.` : '.'}`

      <button type="button" class="btn" data-action="start-session" data-fk="start" ${n ? '' : 'disabled'}>Começar sessão</button>

  const counts = [1, 2, 3, 4, 5].map(b => S.cards.filter(c => c.box === b).length);
  const maxC = Math.max(1, ...counts);
  const boxes = `<section class="sec" aria-labelledby="box-h">
    <h2 id="box-h">Caixas</h2>

    <div class="boxes">${counts.map((n, i) => `<div class="box">
      <div class="box-track" aria-hidden="true"><span style="height:${Math.round(n / maxC * 100)}%"></span></div>
      <span class="box-n">${n}</span>
      <span class="box-l">Caixa ${i + 1}<br>${i === 0 ? 'diária' : `a cada ${INTERVALS[i + 1]} dias`}</span>
    </div>`).join('')}</div>
  </section>`;

  const catOpts = sel => Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
  const sorted = [...S.cards].sort((a, b) => a.front.localeCompare(b.front, 'en', { sensitivity: 'base' }));

  return `
  <header class="page-head"><h1>Inglês</h1><p class="lede">Rumo à Irlanda, um cartão por vez.</p></header>
  ${stats}
  <section class="sec" aria-labelledby="rev-h" style="margin-top:24px">${review}</section>
  ${boxes}
  <section class="sec" aria-labelledby="add-h">
    <h2 id="add-h" style="margin-bottom:12px">Adicionar palavra</h2>
    <form id="form-add-card" class="stack" autocomplete="off">
      <div class="grid2">
        <label class="field">Inglês (frente)<input type="text" name="front" required maxlength="200" lang="en" data-fk="add-front" autocapitalize="off"></label>
        <label class="field">Português (verso)<input type="text" name="back" required maxlength="200"></label>
      </div>
      <label class="field">Exemplo de uso <span class="opt">(opcional)</span><input type="text" name="example" maxlength="300" lang="en"></label>
      <div class="row-end">
        <label class="field">Categoria<select name="category">${catOpts(ui.lastCat)}</select></label>
        <button class="btn" type="submit">Adicionar</button>
      </div>
    </form>
  </section>
  <div class="sec">
    <details class="more" data-key="csv" ${ui.open.csv ? 'open' : ''}>
      <summary>Importar lista em CSV</summary>
      <div class="inner">
        <p class="hint">Uma linha por cartão: <code>frente;verso;exemplo;categoria</code>. Vírgula ou ponto e vírgula funcionam. Exemplo e categoria são opcionais; categorias: <code>dia</code>, <code>ti</code>, <code>irlanda</code>. Repetidos são ignorados.</p>
        <label class="field">Colar CSV<textarea id="csv-text" rows="5" placeholder="deadline;prazo final;The deadline is on Friday.;ti"></textarea></label>
        <div class="row-btns">
          <button type="button" class="btn" data-action="import-csv" data-fk="import-csv">Importar texto</button>
          <label class="btn-ghost file-btn">Escolher arquivo .csv<input type="file" class="sr-only" accept=".csv,.tsv,.txt,text/csv,text/plain" data-change="csv-file"></label>
        </div>
      </div>
    </details>
    <details class="more" data-key="list" ${ui.open.list ? 'open' : ''}>
      <summary>Todos os cartões <span class="muted num">(${S.cards.length})</span></summary>
      <div class="inner">
        <label class="sr-only" for="card-search">Buscar cartão</label>
        <input type="search" id="card-search" placeholder="Buscar em inglês ou português…" value="${esc(ui.search)}" data-fk="card-search">
        <ul class="card-list" id="card-list">${sorted.map(c => `<li data-text="${esc((c.front + ' ' + c.back + ' ' + CATS[c.category]).toLowerCase())}">
          <div class="cl-text"><span class="cl-front" lang="en">${esc(c.front)}</span><span class="cl-back">${esc(c.back)} · ${CATS[c.category]}</span></div>
          <span class="cl-box">caixa ${c.box}</span>
          <button type="button" class="icon-btn" data-action="edit-card" data-id="${c.id}" data-fk="cedit-${c.id}" aria-label="Editar: ${esc(c.front)}">${ICON.edit}</button>
        </li>`).join('')}</ul>
      </div>
    </details>
  </div>`;
}

const VIEWS = { hoje: viewHoje, estudos: viewEstudos, ingles: viewIngles, ajustes: viewAjustes };
const TITLES = { hoje: 'Hoje', estudos: 'Estudos', ingles: 'Inglês', ajustes: 'Ajustes' };
const routeName = () => { const r = location.hash.slice(1); return VIEWS[r] ? r : 'hoje'; };

/* ---------- render ---------- */
const app = $('#app');
function render() {
  const route = routeName();
  const fk = document.activeElement?.dataset?.fk;
  app.innerHTML = VIEWS[route]();
  app.classList.toggle('wide', route === 'hoje');
  $$('.tabs a').forEach(a => { if (a.dataset.tab === route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const due = dueCards().length, badge = $('#badge-ingles');
  badge.hidden = !due; badge.textContent = due > 99 ? '99+' : due;
  badge.setAttribute('aria-label', `${due} para revisar`);
  document.title = `${TITLES[route]} · myHRW`;
  if (route === 'ingles') filterCards();
  const target = ui.focus || fk; ui.focus = null;
  if (target) focusFk(target);
  ui.sig = today() + currentPeriodId();
}
function focusFk(k) {
  if (!k) return;
  let el = document.querySelector(`[data-fk="${CSS.escape(k)}"]`);
  if (!el && k === 'now-check') el = $('#now-title');
  if (el && !el.disabled) el.focus({ preventScroll: true });
}
function filterCards() {
  const list = $('#card-list'); if (!list) return;
  const q = ui.search.trim().toLowerCase();
  $$('li', list).forEach(li => { li.hidden = !!q && !li.dataset.text.includes(q); });
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actionLabel, fn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
  if (fn) el.querySelector('button').addEventListener('click', () => { fn(); el.innerHTML = ''; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; }, fn ? 7000 : 3200);
}

function removeWithUndo(coll, id, msg) {
  const i = S[coll].findIndex(x => x.id === id);
  if (i < 0) return;
  const [item] = S[coll].splice(i, 1);
  save(); render();
  toast(msg, 'Desfazer', () => { S[coll].splice(i, 0, item); save(); render(); });
}

/* ---------- diálogos ---------- */
function openDialog(id) {
  ui.returnFk = document.activeElement?.dataset?.fk || null;
  $('#' + id).showModal();
}
$$('dialog').forEach(d => d.addEventListener('close', () => {
  const k = ui.returnFk; ui.returnFk = null;
  setTimeout(() => focusFk(k));
}));
function confirmBox(title, msg, okLabel, fn) {
  $('#confirm-h').textContent = title;
  $('#confirm-msg').textContent = msg;
  $('#confirm-ok').textContent = okLabel;
  ui.confirmFn = fn;
  openDialog('dlg-confirm');
}

function openTask(task, period) {
  const f = $('#form-task'), el = f.elements;
  f.reset(); f.dataset.id = task ? task.id : '';
  $('#dlg-task-h').textContent = task ? 'Editar tarefa' : 'Nova tarefa';
  el.namedItem('title').value = task ? task.title : '';
  el.namedItem('period').value = task ? task.period : (period || currentPeriodId());
  el.namedItem('due').value = task?.due || '';
  el.namedItem('priority').value = String(task ? task.priority : 2);
  $('[data-action="delete-task"]', f).hidden = !task;
  openDialog('dlg-task');
}
function openExam(exam) {
  const f = $('#form-exam'), el = f.elements;
  f.reset(); f.dataset.id = exam ? exam.id : '';
  $('#dlg-exam-h').textContent = exam ? 'Editar' : 'Nova entrega ou prova';
  el.namedItem('type').value = exam ? exam.type : 'prova';
  el.namedItem('title').value = exam ? exam.title : '';
  el.namedItem('subject').value = exam ? exam.subject : '';
  el.namedItem('date').value = exam ? exam.date : '';
  $('[data-action="delete-exam"]', f).hidden = !exam;
  openDialog('dlg-exam');
}
function openGoal(goal) {
  const f = $('#form-goal'), el = f.elements;
  f.reset(); f.dataset.id = goal ? goal.id : '';
  $('#dlg-goal-h').textContent = goal ? 'Editar meta' : 'Nova meta da semana';
  el.namedItem('title').value = goal ? goal.title : '';
  el.namedItem('target').value = goal ? goal.target : 3;
  $('[data-action="delete-goal"]', f).hidden = !goal;
  openDialog('dlg-goal');
}
function openCard(card) {
  const f = $('#form-card'), el = f.elements;
  f.reset(); f.dataset.id = card.id;
  el.namedItem('category').innerHTML = Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  el.namedItem('front').value = card.front;
  el.namedItem('back').value = card.back;
  el.namedItem('example').value = card.example;
  el.namedItem('category').value = card.category;
  openDialog('dlg-card');
}

function onSave(formId, fn) {
  $('#' + formId).addEventListener('submit', e => {
    if (e.submitter && e.submitter.value !== 'save') return;
    const f = e.currentTarget;
    const v = n => f.elements.namedItem(n).value.trim();
    if (fn(f, v) === false) e.preventDefault();
    else { save(); render(); }
  });
}
onSave('form-task', (f, v) => {
  const data = { title: v('title'), period: v('period'), due: v('due') || null, priority: +v('priority') };
  if (!data.title) return false;
  const t = f.dataset.id && findIn('tasks', f.dataset.id);
  if (t) Object.assign(t, data);
  else { S.tasks.push({ id: uid(), ...data, done: false, doneAt: null, created: new Date().toISOString() }); toast('Tarefa adicionada'); }
});
onSave('form-exam', (f, v) => {
  const data = { type: v('type') || 'prova', title: v('title'), subject: v('subject'), date: v('date') };
  if (!data.title || !isDate(data.date)) return false;
  const x = f.dataset.id && findIn('exams', f.dataset.id);
  if (x) Object.assign(x, data); else S.exams.push({ id: uid(), ...data, done: false });
});
onSave('form-goal', (f, v) => {
  const data = { title: v('title'), target: Math.min(50, Math.max(1, parseInt(v('target'), 10) || 1)) };
  if (!data.title) return false;
  const g = f.dataset.id && findIn('goals', f.dataset.id);
  if (g) Object.assign(g, data);
  else {
    if (weekGoals().length >= MAX_GOALS) { toast('Limite de 5 metas por semana.'); return; }
    S.goals.push({ id: uid(), ...data, progress: 0, week: weekStart() });
  }
});
onSave('form-card', (f, v) => {
  const c = findIn('cards', f.dataset.id);
  const data = { front: v('front'), back: v('back'), example: v('example'), category: v('category') };
  if (!c || !data.front || !data.back) return false;
  Object.assign(c, data);
});
$('#form-confirm').addEventListener('submit', e => {
  const fn = ui.confirmFn; ui.confirmFn = null;
  if (e.submitter && e.submitter.value === 'ok' && fn) fn();
});

/* ---------- sessão de inglês ---------- */
function startSession() {
  const list = dueCards(ui.cat);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  list.sort((a, b) => a.box - b.box);
  const lim = +S.settings.sessionLimit;
  const pick = lim ? list.slice(0, lim) : list;
  if (!pick.length) return;
  session = { queue: pick.map(c => c.id), i: 0, flipped: false, right: 0, wrong: 0, finished: false };
  ui.focus = 'flip';
  render();
  $('#rev-h')?.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' });
}
function flip() {
  if (!session || session.finished || session.flipped) return;
  session.flipped = true; ui.focus = 'ans1'; render();
}
function answer(ok) {
  if (!session || session.finished || !session.flipped) return;
  const c = findIn('cards', session.queue[session.i]);
  const t = today();
  if (c) {
    c.reviews++;
    if (ok) { c.box = Math.min(5, c.box + 1); c.due = addDays(t, INTERVALS[c.box]); session.right++; }
    else { c.box = 1; c.due = t; c.lapses++; session.wrong++; session.queue.push(c.id); }
  }
  session.i++; session.flipped = false;
  markStudied(); save();
  if (session.i >= session.queue.length) { session.finished = true; ui.focus = 'sess-done'; }
  else ui.focus = 'flip';
  render();
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = ch => first.split(ch).length - 1;
  const delim = count('\t') ? '\t' : count(';') >= count(',') && count(';') ? ';' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"' && field === '') q = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  row.push(field); rows.push(row);
  return rows.map(r => r.map(s => s.trim())).filter(r => r.some(Boolean));
}
function normCat(s) {
  const k = (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (/^(ti|it|trabalho|work|tech|ti\/trabalho)/.test(k)) return 'ti';
  if (/^(irlanda|ireland|viagem|travel|irlanda\/viagem)/.test(k)) return 'irlanda';
  return 'dia';
}
function importCSV(text) {
  const rows = parseCSV(text);
  if (rows.length && /^(frente|front|ingl[eê]s|english)$/i.test(rows[0][0])) rows.shift();
  const seen = new Set(S.cards.map(c => c.front.toLowerCase()));
  const t = today(); let added = 0, skipped = 0;
  for (const [front, back, example, cat] of rows) {
    if (!front || !back || seen.has(front.toLowerCase())) { skipped++; continue; }
    seen.add(front.toLowerCase());
    S.cards.push({ id: uid(), front: front.slice(0, 200), back: back.slice(0, 200), example: (example || '').slice(0, 300), category: normCat(cat), box: 1, due: t, created: t, reviews: 0, lapses: 0 });
    added++;
  }
  save(); render();
  toast(`${plural(added, 'cartão adicionado', 'cartões adicionados')}${skipped ? `, ${skipped} ignorado${skipped === 1 ? '' : 's'}` : ''}.`);
}

/* ---------- backup ---------- */
function exportJSON() {
  S.settings.lastBackup = today(); save();
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `myhrw-backup-${today()}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  render(); toast('Backup exportado.');
}
async function importJSON(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('Arquivo inválido: não é um JSON.'); return; }
  if (!data || typeof data !== 'object' || !(Array.isArray(data.tasks) || Array.isArray(data.cards))) { toast('Esse JSON não parece um backup do myHRW.'); return; }
  confirmBox('Importar backup?', `Os dados atuais serão substituídos pelo arquivo "${file.name}".`, 'Substituir', () => {
    S = migrate(data); session = null; save(); applyTheme(); render(); toast('Backup importado.');
  });
}

/* ---------- tema ---------- */
function applyTheme() {
  const th = S.settings.theme;
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
  else delete document.documentElement.dataset.theme;
}

/* ---------- ações ---------- */
const ACTIONS = {
  'close-dialog': el => el.closest('dialog').close(),
  'new-task': el => openTask(null, el.dataset.period),
  'edit-task': el => { const t = findIn('tasks', el.dataset.id); if (t) openTask(t); },
  'delete-task': () => { const id = $('#form-task').dataset.id; $('#dlg-task').close(); removeWithUndo('tasks', id, 'Tarefa excluída'); },
  'clear-done': () => {
    const t = today(), before = S.tasks;
    S.tasks = S.tasks.filter(x => !(x.done && x.doneAt !== t));
    save(); render();
    toast('Concluídas removidas', 'Desfazer', () => { S.tasks = before; save(); render(); });
  },
  'goto-day': () => { const d = $('#dia'); d?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); d?.focus({ preventScroll: true }); },
  'new-exam': () => openExam(null),
  'edit-exam': el => { const x = findIn('exams', el.dataset.id); if (x) openExam(x); },
  'delete-exam': () => { const id = $('#form-exam').dataset.id; $('#dlg-exam').close(); removeWithUndo('exams', id, 'Item excluído'); },
  'new-goal': () => { if (weekGoals().length < MAX_GOALS) openGoal(null); },
  'edit-goal': el => { const g = findIn('goals', el.dataset.id); if (g) openGoal(g); },
  'delete-goal': () => { const id = $('#form-goal').dataset.id; $('#dlg-goal').close(); removeWithUndo('goals', id, 'Meta excluída'); },
  'goal-inc': el => { const g = findIn('goals', el.dataset.id); if (g) { g.progress = Math.min(g.progress + 1, g.target * 3); save(); render(); if (g.progress === g.target) toast(`Meta cumprida: ${g.title}`); } },
  'goal-dec': el => { const g = findIn('goals', el.dataset.id); if (g && g.progress > 0) { g.progress--; save(); render(); } },
  'repeat-goals': () => {
    const ws = weekStart();
    weekGoals(addDays(ws, -7)).slice(0, MAX_GOALS).forEach(g => S.goals.push({ id: uid(), title: g.title, target: g.target, progress: 0, week: ws }));
    ui.focus = 'new-goal'; save(); render();
  },
  'set-cat': el => { ui.cat = el.dataset.cat; ui.focus = 'cat-' + ui.cat; render(); },
  'start-session': startSession,
  'flip': flip,
  'answer': el => answer(el.dataset.ok === '1'),
  'end-session': () => { const wasDone = session?.finished; session = null; ui.focus = 'start'; render(); if (!wasDone) toast('Sessão encerrada. O progresso foi salvo.'); },
  'import-csv': () => { const ta = $('#csv-text'); if (!ta.value.trim()) { toast('Cole o CSV no campo primeiro.'); ta.focus(); return; } ui.open.csv = true; importCSV(ta.value); },
  'edit-card': el => { const c = findIn('cards', el.dataset.id); if (c) openCard(c); },
  'delete-card': () => {
    const id = $('#form-card').dataset.id; $('#dlg-card').close();
    if (session) session.queue = session.queue.filter((q, i) => i < session.i || q !== id);
    removeWithUndo('cards', id, 'Cartão excluído');
  },
  'export': exportJSON,
  'reset': () => confirmBox('Apagar todos os dados?', 'Isso não pode ser desfeito. Exporte um backup antes, se quiser guardar algo.', 'Apagar tudo', () => {
    try { localStorage.removeItem(KEY); } catch {}
    S = defaultState(); session = null; save(); applyTheme(); render(); toast('Dados apagados.');
  })
};
const CHANGES = {
  'toggle-task': el => {
    const x = findIn('tasks', el.dataset.id); if (!x) return;
    x.done = el.checked; x.doneAt = x.done ? today() : null;
    if (el.dataset.fk === 'now-check') ui.focus = 'now-check';
    save(); render();
    if (x.done) toast('Feito!', 'Desfazer', () => { x.done = false; x.doneAt = null; save(); render(); });
  },
  'toggle-exam': el => { const x = findIn('exams', el.dataset.id); if (x) { x.done = el.checked; save(); render(); } },
  'csv-file': async el => { const f = el.files[0]; if (f) { ui.open.csv = true; importCSV(await f.text()); } },
  'import-file': el => { const f = el.files[0]; if (f) importJSON(f); el.value = ''; },
  'set-theme': el => { S.settings.theme = el.value; save(); applyTheme(); },
  'set-name': el => { S.settings.name = el.value.trim().slice(0, 40); save(); toast('Nome salvo.'); },
  'set-limit': el => { S.settings.sessionLimit = +el.value; save(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !el.dataset.action || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'card-search') { ui.search = e.target.value; filterCards(); }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches?.('details[data-key]')) ui.open[d.dataset.key] = d.open;
}, true);
document.addEventListener('submit', e => {
  if (e.target.id === 'form-quick') {
    e.preventDefault();
    const title = e.target.elements.namedItem('q').value.trim();
    if (!title) return;
    S.tasks.push({ id: uid(), title: title.slice(0, 140), period: currentPeriodId(), due: null, priority: 2, done: false, doneAt: null, created: new Date().toISOString() });
    ui.focus = 'quick'; save(); render(); toast('Tarefa adicionada');
  } else if (e.target.id === 'form-add-card') {
    e.preventDefault();
    const el = e.target.elements, v = n => el.namedItem(n).value.trim();
    const front = v('front'), back = v('back');
    if (!front || !back) return;
    if (S.cards.some(c => c.front.toLowerCase() === front.toLowerCase())) { toast(`"${front}" já existe.`); return; }
    ui.lastCat = v('category');
    S.cards.push({ id: uid(), front, back, example: v('example'), category: ui.lastCat, box: 1, due: today(), created: today(), reviews: 0, lapses: 0 });
    ui.focus = 'add-front'; save(); render(); toast(`"${front}" adicionado.`);
  }
});

document.addEventListener('keydown', e => {
  if (routeName() !== 'ingles' || !session || session.finished) return;
  if (document.querySelector('dialog[open]') || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target instanceof Element ? e.target : document.body;
  if (tg.matches('input, textarea, select')) return;
  const onControl = tg.matches('button, a, summary, label');
  if (!session.flipped && (e.key === ' ' || e.key === 'Enter')) {
    if (onControl) return; // botão focado já trata o clique nativo
    e.preventDefault(); flip();
  } else if (session.flipped && (e.key === '1' || e.key === '2')) {
    e.preventDefault(); answer(e.key === '2');
  }
});

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

// atualiza a tela "Hoje" quando muda o período ou o dia
function tick() {
  if (document.hidden || ui.sig === today() + currentPeriodId()) return;
  if (document.querySelector('dialog[open]') || document.activeElement?.matches('input, textarea, select')) return;
  render();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', tick);

/* ---------- início ---------- */
load();
applyTheme();
save();
render();
navigator.storage?.persist?.().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
